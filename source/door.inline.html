  var NS='http://www.w3.org/2000/svg';

  }
  var SE=[];
  for(var q=0;q<F.length;q++){ for(var d=0;d<3;d++){ var sv=0.12+d*0.22, sx=lerp(F[q].bx,VP.x,sv), sy=lerp(560,VP.y,sv); if(sx<-20||sx>1020) continue; var c=document.createElementNS(NS,'circle'); c.setAttribute('cx',sx); c.setAttribute('cy',sy-120); c.setAttribute('r',2.2*(1-sv)+0.8); c.setAttribute('opacity',0); seedsG.appendChild(c); SE.push({el:c,x:sx,y:sy,delay:((q*7+d*13)%9)*90}); } }
  var RN=[];

  function mix(a,b,p){ function h(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]} var A=h(a),B=h(b); return 'rgb('+Math.round(lerp(A[0],B[0],p))+','+Math.round(lerp(A[1],B[1],p))+','+Math.round(lerp(A[2],B[2],p))+')'; }

  var DUR=17800, raf=null, t0=null, done=false, EYE_OPEN=13700;
  var counted=false;
  function stage(n){ for(var k=1;k<=5;k++) html.classList.toggle('vd-s'+k, k<=n); }
  function logoRect(){ var img=document.querySelector('.hdr-logo img'); if(!img) return null; var r=img.getBoundingClientRect(); if(!r.width) return null; var w=r.width*0.31, h=r.height; var hw=w/ (229/193); if(hw>h){ hw=h; } return {x:r.left, y:r.top+(h-hw)/2, w:hw*(229/193), h:hw}; }
  function countUp(p){ var bs=document.querySelectorAll('.fd-body b, .fd-door-b b'); for(var i=0;i<bs.length;i++){ var b=bs[i]; if(!b.getAttribute('data-vd')) b.setAttribute('data-vd', b.textContent); var full=b.getAttribute('data-vd'); var m=/^([\d,]+)(.*)$/.exec(full); if(!m) continue; var v=parseInt(m[1].replace(/,/g,''),10); if(isNaN(v)) continue; var cur=Math.round(v*p); b.textContent=(p>=1?m[1]:String(cur).replace(/\B(?=(\d{3})+(?!\d))/g,','))+m[2]; } }
  function paint(t){
    if(done) return;
    var day=ease(seg(t,2800,5200)), warm=ease(seg(t,6400,7800));
    skyr.setAttribute('fill', warm>0? mix('#e6eee8','#fbf9f3',warm) : mix('#dfe7e1','#e6eee8',day));
    hazer.setAttribute('fill', warm>0? mix('#f0eee5','#f8ecc8',warm) : mix('#e9e6dc','#f0eee5',day));
    horizon.setAttribute('stroke-dashoffset', 1-ease(seg(t,100,1200)));
    var g=ease(seg(t,8000,9600)), fo=1-seg(t,8800,9700);
    if(t<=9800) for(var i=0;i<F.length;i++){
      var f=F[i];
      f.el.setAttribute('stroke-dashoffset', 1-ease(seg(t,400+f.order*35,1500+f.order*35)));
      if(g>0){
        var ex=lerp(VP.x,G.x,g), ey=lerp(VP.y,G.y,g);
        var cx=(f.bx+ex)/2 + (f.bx<G.x?-1:1)*60*g, cy=(560+ey)/2 - 150*g;
        f.el.setAttribute('d','M'+f.bx+' 560 Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1));
      } else { f.el.setAttribute('d','M'+f.bx+' 560 L'+VP.x+' '+VP.y); }
    }
    fur.setAttribute('opacity', 0.9*fo); water.setAttribute('opacity', 1-seg(t,7800,8400));
    if(t>=1100 && t<=3600) for(var a=0;a<SE.length;a++){ var se=SE[a], p=seg(t,1200+se.delay,1900+se.delay); se.el.setAttribute('cy', se.y-120*(1-p*p)); se.el.setAttribute('opacity', p<=0?0:(1-seg(t,2200+se.delay,2700+se.delay))); }
    cwr.setAttribute('height', 324*ease(seg(t,2200,3600)));
    var ro=Math.sin(Math.PI*seg(t,3000,4200)); rainG.setAttribute('opacity', 0.55*ro);
    if(ro>0){ for(var b=0;b<RN.length;b++){ var rn=RN[b], fall=((t/900)+rn.ph)%1; rn.el.setAttribute('transform','translate(0 '+(fall*560-280).toFixed(0)+')'); } }
    var sf=1-seg(t,8000,8900), wind=Math.sin(Math.PI*seg(t,6600,8000));
    if(t>=3300 && t<=9000) for(var j=0;j<S.length;j++){
      var s=S[j], gr=ease(seg(t,3400+s.delay*1.4,5000+s.delay*1.4)), hd=ease(seg(t,6400+s.delay*0.9,7600+s.delay*0.9));
      var sway = wind>0 ? Math.sin(t/260 + s.x/90)*3.2*wind*(s.L/47) : 0;
      s.st.setAttribute('y2', s.y - s.L*gr); s.st.setAttribute('x2', s.x+sway); s.st.setAttribute('stroke', hd>0.5?'var(--green)':'var(--shoot)'); s.st.setAttribute('opacity', gr>0?1:0);
      s.hd.setAttribute('cy', s.y - s.L*gr); s.hd.setAttribute('cx', s.x+sway); s.hd.setAttribute('opacity', hd);
    }

    var h=ease(seg(t,8200,9700));
    mhr.setAttribute('x', 1000-1000*h); mhr.setAttribute('width', 1000*h);
    veil.setAttribute('opacity', 0.45*ease(seg(t,8400,9900)));
    trees.setAttribute('opacity', 0.85*ease(seg(t,600,1800)) - 0.6*ease(seg(t,10300,11000)));

    holec.setAttribute('r', 1400*ease(seg(t,13400,14100)));
    if(t>=13300 && t<EYE_OPEN){ var vw2=window.innerWidth, vh2=window.innerHeight, sc2=Math.max(vw2/1000, vh2/560), ox2=(vw2-1000*sc2)/2+(vw2/vh2<0.75?60*sc2:0), oy2=(vh2-560*sc2)/2; var zx=function(p){return EYE.x+(p-EYE.x)*z}, zy=function(p){return EYE.y+(p-EYE.y)*z}; FLY.from={x:ox2+zx(364)*sc2, y:oy2+zy(174)*sc2, w:458*z*sc2, h:386*z*sc2}; fly.style.display='block'; fly.style.opacity=1; fly.style.left=FLY.from.x+'px'; fly.style.top=FLY.from.y+'px'; fly.style.width=FLY.from.w+'px'; fly.style.height=FLY.from.h+'px'; }
    // the eye covers every screen by 13.7 s (hole radius x zoom > the farthest corner even on a 21:9 screen); then the page starts up behind it
    if(t>=EYE_OPEN){
      scene.style.display='none'; enter.style.display='none';
      var b=t-EYE_OPEN;
      stage(b>=3300?5:b>=2600?4:b>=1400?3:b>=1150?2:b>=100?1:0);
      // the horse goes to its place in the mark, and stays on it until the header has come
      if(b<1800){ if(!FLY.to){ FLY.to=logoRect()||{x:16,y:12,w:0,h:0}; } var fp=ease(seg(b,0,850)); fly.style.display='block'; fly.style.opacity=1; fly.style.left=lerp(FLY.from.x,FLY.to.x,fp)+'px'; fly.style.top=lerp(FLY.from.y,FLY.to.y,fp)+'px'; fly.style.width=lerp(FLY.from.w,FLY.to.w,fp)+'px'; fly.style.height=lerp(FLY.from.h,FLY.to.h,fp)+'px'; }
      else { fly.style.display='none'; }

  }
  function bail(){ if(done) return; done=true; if(raf) cancelAnimationFrame(raf); try{ countUp(1); }catch(e){} try{ drop(); }catch(e){} try{ window.removeEventListener('keydown',onKey); }catch(e){} }

  enter.addEventListener('click',function(){finish(0);});

  door.addEventListener('touchmove',function(){finish(700);},{passive:true});

  try{ window.scrollTo(0,0); }catch(e){}

  raf=requestAnimationFrame(frame);
  }catch(e){ standDown(); }
